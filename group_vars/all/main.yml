# Общие настройки для всех серверов. Секреты — в vault.yml (ansible-vault), см. vault.example.yml
timezone: Etc/UTC

# swap создаётся, если его нет; 0 — не создавать
swap_size_mb: 512

# свои адреса, которые fail2ban никогда не банит (домашний IP и т.п.)
fail2ban_ignoreip_extra: []

# входящие порты: открыты для всех
firewall_public_ports:
  - {port: 22, proto: tcp, comment: ssh}
  - {port: 80, proto: tcp, comment: acme http-01}
  - {port: 443, proto: tcp, comment: https}

# входящие порты: открыты только для второго сервера (peer_ip)
firewall_peer_ports:
  - {port: 8443, proto: tcp, comment: internal api from peer}

# версия стека мониторинга (тег репозитория monitoring-stack)
monitoring_stack_repo: https://github.com/RealPycuk/monitoring-stack.git
monitoring_stack_version: v1.0.0

# пароль отключается, только если в журнале уже есть успешный вход по ключу
ssh_require_key_login: true
